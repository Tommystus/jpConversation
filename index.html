<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JP Conv — N5 Conversation Practice</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="#" id="home-link" class="brand">日本語<span class="brand-sub">JP Conv · N5</span></a>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
    </header>

    <main id="app"></main>

    <dialog id="settings-dialog">
      <form method="dialog">
        <h2>Settings</h2>

        <label class="field">
          <span>Japanese voice</span>
          <select id="setting-voice"></select>
        </label>

        <label class="field">
          <span>Speech speed: <output id="rate-output"></output></span>
          <input type="range" id="setting-rate" min="0.5" max="1.2" step="0.05" />
        </label>

        <label class="check">
          <input type="checkbox" id="setting-furigana" />
          Show furigana over kanji
        </label>

        <label class="check">
          <input type="checkbox" id="setting-kana" />
          Kana only (hide all kanji)
        </label>

        <label class="check">
          <input type="checkbox" id="setting-en" />
          Show English translations by default
        </label>

        <div class="danger-zone">
          <button type="button" id="clear-progress-btn" class="btn btn-danger">
            Clear all progress
          </button>
        </div>

        <p class="hint-text">
          Tip: use Chrome or Edge for microphone support. The mic needs an
          internet connection (recognition runs through Google's service).
        </p>

        <menu>
          <li><button value="cancel" class="btn">Close</button></li>
        </menu>
      </form>
    </dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
